
{% extends 'core/base.html' %}

{% block title %}EduSphere | Login{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
    min-height: 75vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
}

.auth-card {
    width: 100%;
    max-width: 460px;
    padding: 42px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 70px rgba(0,0,0,0.3);
}

.auth-header {
    text-align: center;
    margin-bottom: 32px;
}

.auth-icon {
    width: 65px;
    height: 65px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    border-radius: 20px;
    background: linear-gradient(135deg,#8175ff,#42d9ff);
    font-size: 28px;
}

.auth-header h1 {
    font-size: 30px;
    margin-bottom: 12px;
}

.auth-header p {
    color: #9ba5c3;
    font-size: 14px;
    line-height: 1.6;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    margin-bottom: 9px;
    font-size: 13px;
    font-weight: 600;
    color: #dce2f5;
}

.form-group input {
    width: 100%;
    padding: 15px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 11px;
    background: rgba(255,255,255,0.04);
    color: white;
    outline: none;
    transition: 0.3s;
}

.form-group input:focus {
    border-color: #8175ff;
    box-shadow: 0 0 18px rgba(129,117,255,0.15);
}

.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    font-size: 12px;
    color: #9ba5c3;
}

.form-options a,
.auth-footer a {
    color: #9c91ff;
    font-weight: 600;
}

.remember {
    display: flex;
    align-items: center;
    gap: 7px;
}

.submit-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(120deg,#8175ff,#439dff);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(129,117,255,0.3);
}

.auth-footer {
    text-align: center;
    margin-top: 27px;
    color: #9ba5c3;
    font-size: 13px;
}

@media(max-width:500px) {
    .auth-card { padding: 28px 22px; }
}
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">✦</div>
            <h1>Welcome Back</h1>
            <p>Sign in to continue your learning journey with EduSphere.</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username"
                       name="username"
                       placeholder="Enter your username"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">
                Sign In →
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="/accounts/register/">Create Account</a>
        </div>

    </div>
</div>
{% endblock %}
