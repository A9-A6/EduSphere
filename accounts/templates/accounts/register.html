
{% extends 'core/base.html' %}

{% block title %}EduSphere | Create Account{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 55px 20px;
}

.auth-card {
    width: 100%;
    max-width: 500px;
    padding: 40px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 70px rgba(0,0,0,0.3);
}

.auth-header {
    text-align: center;
    margin-bottom: 30px;
}

.auth-icon {
    width: 65px;
    height: 65px;
    margin: 0 auto 18px;
    display: grid;
    place-items: center;
    border-radius: 20px;
    background: linear-gradient(135deg,#8175ff,#42d9ff);
    font-size: 28px;
}

.auth-header h1 {
    font-size: 29px;
    margin-bottom: 10px;
}

.auth-header p {
    color: #9ba5c3;
    font-size: 14px;
}

.form-group { margin-bottom: 19px; }

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #dce2f5;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 11px;
    background: #151c32;
    color: white;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #8175ff;
    box-shadow: 0 0 18px rgba(129,117,255,0.15);
}

.form-group select option {
    background: #151c32;
    color: white;
}

.submit-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(120deg,#8175ff,#439dff);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(129,117,255,0.3);
}

.auth-footer {
    text-align: center;
    margin-top: 25px;
    color: #9ba5c3;
    font-size: 13px;
}

.auth-footer a {
    color: #9c91ff;
    font-weight: 600;
}

@media(max-width:500px) {
    .auth-card { padding: 28px 22px; }
}
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">✦</div>
            <h1>Create Your Account</h1>
            <p>Join EduSphere and start your learning journey.</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password1">Password</label>
                <input type="password" id="password1" name="password1"
                       placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="password2">Confirm Password</label>
                <input type="password" id="password2" name="password2"
                       placeholder="Confirm your password" required>
            </div>

            <div class="form-group">
                <label for="university">University</label>
                <select id="university" name="university">
                    <option value="">Select your university</option>
                    <option value="ADNSU">ADNSU</option>
                    <option value="ADA">ADA University</option>
                    <option value="BSU">Baku State University</option>
                    <option value="UNEC">UNEC</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">
                Create Account →
            </button>
        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="/accounts/login/">Sign In</a>
        </div>

    </div>
</div>
{% endblock %}
